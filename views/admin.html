<!doctype html>
<html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><title>Panel</title>
<style>
:root{--g:#39ff14;--bg:#070d09;--c:#0f1a13;--b:#1e3326;--t:#e8fff0;--m:#7fa38b;--r:#ff4d5e}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:14px system-ui,-apple-system,sans-serif}
input,select,textarea{width:100%;padding:11px 12px;margin:5px 0;background:#08120c;border:1px solid var(--b);border-radius:10px;color:var(--t);font:inherit;font-size:16px}
input[type=checkbox]{width:auto;margin-right:6px}
button{padding:10px 14px;border:0;border-radius:10px;background:var(--g);color:#031a08;font-weight:700;cursor:pointer;font-size:14px;margin:2px 0}
button.d{background:var(--r);color:#fff}button.s{background:#1e3326;color:var(--t)}
#login{display:grid;place-items:center;height:100vh;padding:16px}
.box{background:var(--c);border:1px solid var(--b);border-radius:16px;padding:24px;width:100%;max-width:340px}
#app{display:none;min-height:100vh}
aside{position:fixed;left:0;top:0;bottom:0;width:220px;background:var(--c);border-right:1px solid var(--b);padding:14px;overflow:auto}
aside h3{color:var(--g);margin:4px 0 4px}
aside small{color:var(--m);display:block;margin-bottom:12px}
aside a{display:block;padding:11px;border-radius:10px;color:var(--m);cursor:pointer;margin-bottom:2px}
aside a.on,aside a:hover{background:#15301f;color:var(--t)}
main{margin-left:220px;padding:20px;max-width:1040px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.st{background:var(--c);border:1px solid var(--b);border-radius:14px;padding:16px;color:var(--m)}.st b{display:block;font-size:26px;color:var(--g)}
.panel{background:var(--c);border:1px solid var(--b);border-radius:14px;padding:16px;margin-bottom:16px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid var(--b);text-align:left;vertical-align:middle}
img.t{width:40px;height:56px;object-fit:cover;border-radius:6px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.warn{background:#3a1218;border:1px solid var(--r);color:#ffd5da;padding:14px;border-radius:12px;margin-bottom:16px;line-height:1.5}
#toast{position:fixed;bottom:20px;right:20px;left:20px;max-width:380px;margin-left:auto;background:var(--g);color:#031a08;padding:12px 18px;border-radius:12px;font-weight:700;display:none;z-index:99}
.bar{height:8px;background:#15301f;border-radius:9px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;width:0;background:var(--g);transition:width .2s}
.mo{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:20px 12px;overflow:auto}
.mo>div{background:var(--c);border:1px solid var(--b);border-radius:16px;padding:18px;width:100%;max-width:520px}
.sw{display:flex;align-items:center;gap:10px;padding:10px 0}
@media(max-width:760px){
 aside{position:sticky;width:auto;display:flex;flex-wrap:nowrap;gap:4px;overflow-x:auto;padding:10px;border-right:0;border-bottom:1px solid var(--b);z-index:5;align-items:center;bottom:auto}
 aside h3,aside small{display:none}#menu{display:flex;gap:4px}aside a{white-space:nowrap;margin:0}
 main{margin:0;padding:12px}.row{grid-template-columns:1fr}
}
</style></head><body>
<div id="login"><div class="box"><h3 style="margin-top:0">🔐 Admin</h3>
<input id="lu" placeholder="Login" autocomplete="username" autocapitalize="none"><input id="lp" type="password" placeholder="Parol" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
<button style="width:100%;margin-top:8px" onclick="doLogin()">Kirish</button></div></div>
<div id="app"><aside><h3>VITRINO TV</h3><small id="who"></small><div id="menu"></div></aside><main id="main"></main></div>
<div id="toast"></div>
<script>
const B = location.pathname.replace(/\/$/, '');
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let ME = null, CUR = 'dash', LIVE = null;
function toast(t) { const e = $('#toast'); e.textContent = t; e.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => e.style.display = 'none', 3500); }
async function req(m, p, body) {
  const o = { method: m, headers: {} };
  if (body instanceof FormData) o.body = body; else if (body) { o.headers['content-type'] = 'application/json'; o.body = JSON.stringify(body); }
  const r = await fetch(B + '/api' + p, o);
  if (r.status === 401 && p !== '/login') { showLogin(); throw 0; }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { toast(j.error || 'Xato'); throw j; }
  return j;
}
function upload(p, fd, cb) {
  return new Promise((ok, no) => {
    const x = new XMLHttpRequest(); x.open('POST', B + '/api' + p);
    x.upload.onprogress = e => cb && cb(Math.round(e.loaded / e.total * 100));
    x.onload = () => x.status < 300 ? ok(JSON.parse(x.responseText)) : no(x.responseText);
    x.onerror = no; x.send(fd);
  });
}
async function chunkUpload(file, id, number, extra, cb) {
  const CH = 8 * 1024 * 1024, total = Math.ceil(file.size / CH);
  const uid = Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  let done = 0, next = 0;
  async function worker() {
    while (next < total) {
      const i = next++, blob = file.slice(i * CH, (i + 1) * CH);
      for (let t = 0; ; t++) {
        try {
          const r = await fetch(B + '/api/chunk/' + uid + '/' + i, { method: 'POST', headers: { 'content-type': 'application/octet-stream' }, body: blob });
          if (!r.ok) throw 0;
          break;
        } catch (e) { if (t >= 4) throw new Error('chunk'); await new Promise(r => setTimeout(r, 1500 * (t + 1))); }
      }
      done++; if (cb) cb(Math.round(done / total * 100));
    }
  }
  await Promise.all(Array.from({ length: 8 }, worker));
  const ext = (file.name.match(/\.[A-Za-z0-9]+$/) || ['.mp4'])[0];
  await req('POST', '/movies/' + id + '/finish', Object.assign({ uid, total, ext, number }, extra || {}));
}
async function s3Upload(file, id, number, extra, cb) {
  const ext = (file.name.match(/\.[A-Za-z0-9]+$/) || ['.mp4'])[0];
  const init = await req('POST', '/s3/init', { size: file.size, ext, type: file.type || 'video/mp4' });
  const parts = new Array(init.urls.length); let next = 0, done = 0;
  async function worker() {
    while (next < init.urls.length) {
      const i = next++, blob = file.slice(i * init.partSize, (i + 1) * init.partSize);
      for (let t = 0; ; t++) {
        try {
          const r = await fetch(init.urls[i], { method: 'PUT', body: blob });
          if (!r.ok) throw new Error('http' + r.status);
          const et = r.headers.get('ETag');
          if (!et) throw new Error('cors');
          parts[i] = { n: i + 1, etag: et }; break;
        } catch (e) {
          if (e.message === 'cors' || t >= 4) throw e;
          await new Promise(r => setTimeout(r, 1500 * (t + 1)));
        }
      }
      done++; if (cb) cb(Math.round(done / init.urls.length * 100));
    }
  }
  try {
    await Promise.all(Array.from({ length: 8 }, worker));
  } catch (e) {
    req('POST', '/s3/abort', { key: init.key, uploadId: init.uploadId }).catch(() => {});
    if (e.message === 'cors') toast("CORS sozlanmagan: bucket CORS'da PUT ruxsat va ExposeHeaders ETag qo'shing");
    throw e;
  }
  await req('POST', '/s3/complete', Object.assign({ key: init.key, uploadId: init.uploadId, parts, movieId: id, number, size: file.size }, extra || {}));
}
function uploadVideo(file, id, number, extra, cb) { return ME && ME.s3 ? s3Upload(file, id, number, extra, cb) : chunkUpload(file, id, number, extra, cb); }
function showLogin() { $('#login').style.display = 'grid'; $('#app').style.display = 'none'; if (LIVE) { LIVE.close(); LIVE = null; } }
async function doLogin() { try { await req('POST', '/login', { username: $('#lu').value, password: $('#lp').value }); start(); } catch (e) {} }
const NAMES = { dash: '📊 Statistika', movies: '🎬 Kinolar', cats: '🗂 Kategoriyalar', pays: "💳 To'lovlar", banners: '🖼 Reklama', users: '👥 Foydalanuvchilar', msg: '📣 Xabar yuborish', subs: '📢 Majburiy obuna', bots: '🤖 Botlar', admins: '🛡 Adminlar', settings: '⚙️ Sozlamalar', acc: '🔐 Hisob' };
const SUPER = ['users', 'msg', 'subs', 'bots', 'admins', 'settings'];
function go(k) { CUR = k; document.querySelectorAll('aside a').forEach(a => a.classList.toggle('on', a.dataset.k === k)); tabs[k](); }
async function start() {
  try { ME = await req('GET', '/me'); } catch (e) { return showLogin(); }
  $('#login').style.display = 'none'; $('#app').style.display = 'block';
  $('#who').textContent = ME.username + (ME.role === 'super' ? ' • bosh admin' : ' • yordamchi');
  $('#menu').innerHTML = Object.entries(NAMES).filter(([k]) => ME.role === 'super' || !SUPER.includes(k)).map(([k, v]) => `<a data-k="${k}" onclick="go('${k}')">${v}</a>`).join('');
  if (LIVE) LIVE.close();
  LIVE = new EventSource(B + '/api/live');
  LIVE.addEventListener('pay', e => { toast("💳 Yangi to'lov: " + JSON.parse(e.data).title); if (CUR === 'pays') go('pays'); });
  LIVE.addEventListener('user', e => { toast('👤 Yangi foydalanuvchi: ' + JSON.parse(e.data).name); if (CUR === 'dash') go('dash'); });
  LIVE.addEventListener('broadcast', e => { const d = JSON.parse(e.data); toast(`📣 Xabar yuborildi: ${d.ok} ta, xato: ${d.fail}`); });
  go('dash');
}
const out = h => $('#main').innerHTML = h;
function modal(h) { closeModal(); const d = document.createElement('div'); d.className = 'mo'; d.id = 'mo'; d.innerHTML = '<div>' + h + '</div>'; d.addEventListener('click', e => { if (e.target === d) closeModal(); }); document.body.appendChild(d); }
function closeModal() { const m = $('#mo'); if (m) m.remove(); }

const tabs = {
  async dash() {
    const s = await req('GET', '/stats');
    out(`${s.persistent ? '' : `<div class="warn">⚠️ <b>Doimiy disk ulanmagan!</b> Kinolar, foydalanuvchilar va sozlamalar server qayta ishga tushganda <b>o'chib ketadi</b>. Ikki yo'l: (1) bepul S3 saqlash (Cloudflare R2 / Backblaze B2) ulash, yoki (2) Render'da pullik <b>Disk</b> qo'shish (Mount path <code>/var/data</code>, <code>DATA_DIR=/var/data</code>).</div>`}
    <h2>📊 Statistika</h2><div class="cards">
    <div class="st">Foydalanuvchilar<b>${s.users}</b></div><div class="st">Bugun qo'shilgan<b>${s.today}</b></div><div class="st">Online (5 daq)<b>${s.online}</b></div><div class="st">Hozir ochiq<b>${s.live}</b></div>
    <div class="st">Bloklangan<b>${s.blocked}</b></div><div class="st">Kinolar<b>${s.movies}</b></div><div class="st">Ko'rishlar<b>${s.views}</b></div><div class="st">Kutilayotgan to'lov<b>${s.pending}</b></div></div>`);
  },
  async movies() {
    const [cats, list] = await Promise.all([req('GET', '/categories'), req('GET', '/movies')]);
    out(`<h2>🎬 Kinolar</h2><div class="panel"><h3 style="margin-top:0">Yangi kino / serial qo'shish</h3>
    <div class="row"><input id="mt" placeholder="Nomi"><input id="my" type="number" placeholder="Yili (2024)"></div>
    <div class="row"><select id="mc"><option value="">Kategoriya</option>${cats.map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select>
    <select id="mtype"><option value="movie">Kino</option><option value="series">Serial</option></select></div>
    <div class="row"><input id="mp" type="number" placeholder="Narxi (0 = bepul)" value="0"><input id="mn" type="number" placeholder="Qism raqami (serial uchun)" value="1"></div>
    <textarea id="md" rows="3" placeholder="Tavsif"></textarea>
    <label><input type="checkbox" id="mdl" checked>Foydalanuvchi yuklab olishi mumkin</label><br>
    <label><input type="checkbox" id="mnf">Hammaga xabar yuborish (yangi kino)</label><br>
    <label><input type="checkbox" id="mft">Bosh sahifada katta (hero) qilib ko'rsatish</label>
    <p>🖼 Poster: <input id="mpo" type="file" accept="image/*"></p><p>🎞 Video: <input id="mv" type="file" accept="video/*"></p>
    <button id="msave" onclick="saveMovie()">Saqlash</button><div class="bar"><i id="mbar"></i></div></div>
    <div class="panel tw"><table><tr><th></th><th>Nomi</th><th>Narx</th><th>Qism</th><th>👁</th><th></th></tr>
    ${list.map(m => `<tr><td>${m.poster ? `<img class="t" src="/files/${esc(m.poster)}">` : ''}</td><td>${esc(m.title)}<br><small>${m.year || ''} ${esc(m.cat || '')} ${m.type === 'series' ? '(serial)' : ''}</small></td><td>${m.price ? m.price : 'bepul'}</td><td>${m.eps}</td><td>${m.views}</td>
    <td style="white-space:nowrap"><button class="s" onclick="editMovie(${m.id})">✏️</button> <button class="s" onclick="showEps(${m.id})">🎞</button> <button class="s" onclick="addEp(${m.id})">+qism</button> <button class="d" onclick="del('/movies/${m.id}','movies')">✕</button></td></tr>`).join('')}</table></div>`);
  },
  async cats() {
    const l = await req('GET', '/categories');
    out(`<h2>🗂 Kategoriyalar</h2><div class="panel"><input id="cn" placeholder="Masalan: Komediya"><button onclick="act('POST','/categories',{name:$('#cn').value},'cats')">Qo'shish</button></div>
    <div class="panel"><table>${l.map(c => `<tr><td>${esc(c.name)}</td><td style="text-align:right"><button class="d" onclick="del('/categories/${c.id}','cats')">✕</button></td></tr>`).join('')}</table></div>`);
  },
  async pays() {
    const [p, pm] = await Promise.all([req('GET', '/purchases'), req('GET', '/paymethods')]);
    out(`<h2>💳 To'lovlar</h2><div class="panel"><h3 style="margin-top:0">Kutilayotgan cheklar</h3>${p.map(x => `<div style="display:flex;gap:12px;align-items:center;margin:10px 0;flex-wrap:wrap"><a href="${B}/api/receipt/${x.id}" target="_blank"><img class="t" style="width:70px;height:90px" src="${B}/api/receipt/${x.id}"></a>
    <div style="flex:1;min-width:140px"><b>${esc(x.title)}</b><br>${esc(x.name)} ${x.username ? '@' + esc(x.username) : ''} (${x.user_id})</div>
    <div><button onclick="act('POST','/purchases/${x.id}/approve',null,'pays')">✅ Tasdiqlash</button> <button class="d" onclick="act('POST','/purchases/${x.id}/reject',null,'pays')">❌</button></div></div>`).join('') || "<p>Yo'q</p>"}</div>
    <div class="panel"><h3 style="margin-top:0">To'lov usullari (karta)</h3>${ME.role === 'super' ? `<div class="row"><input id="pn" placeholder="Nomi (Uzcard / Humo)"><input id="pc" placeholder="Karta raqami"></div><div class="row"><input id="ph" placeholder="Egasi"><input id="pt" placeholder="Izoh"></div>
    <button onclick="act('POST','/paymethods',{name:$('#pn').value,card:$('#pc').value,holder:$('#ph').value,note:$('#pt').value},'pays')">Qo'shish</button>` : ''}
    <div class="tw"><table>${pm.map(x => `<tr><td>${esc(x.name)}</td><td>${esc(x.card)}</td><td>${esc(x.holder)}</td><td>${ME.role === 'super' ? `<button class="d" onclick="del('/paymethods/${x.id}','pays')">✕</button>` : ''}</td></tr>`).join('')}</table></div></div>`);
  },
  async banners() {
    const l = await req('GET', '/banners');
    out(`<h2>🖼 Reklama bannerlari</h2><div class="panel"><p>Rasm yoki video: <input id="bf" type="file" accept="image/*,video/*"></p><select id="bp"><option value="top">Tepada (aylanuvchi katta banner)</option><option value="inline">Bosh sahifa o'rtasida</option><option value="detail">Kino sahifasida</option></select><input id="bl" placeholder="Bosilganda ochiladigan havola (ixtiyoriy)">
    <button onclick="addBanner()">Yuklash</button></div><div class="panel tw"><table>${l.map(b => `<tr><td>${b.kind === 'video' ? `<video src="/files/${b.file}" style="width:130px" muted></video>` : `<img src="/files/${b.file}" style="width:130px">`}</td><td>${esc(b.place || 'top')}<br><small>👁 ${b.views || 0} • 👆 ${b.clicks || 0}</small><br><small>${esc(b.link)}</small></td>
    <td style="white-space:nowrap"><button class="s" onclick="act('POST','/banners/${b.id}/toggle',null,'banners')">${b.active ? 'Yoqilgan' : "O'chirilgan"}</button> <button class="d" onclick="del('/banners/${b.id}','banners')">✕</button></td></tr>`).join('')}</table></div>`);
  },
  async users(q = '') {
    const l = await req('GET', '/users?q=' + encodeURIComponent(q));
    out(`<h2>👥 Foydalanuvchilar (${l.length})</h2><div class="panel"><input id="uq" placeholder="Qidirish: ism, @username, telefon, ID" value="${esc(q)}" onkeydown="if(event.key==='Enter')tabs.users(this.value)">
    <div class="tw"><table><tr><th>ID</th><th>Ism</th><th>Username</th><th>Telefon</th><th>Qo'shilgan</th><th></th></tr>${l.map(u => `<tr><td>${u.tg_id}</td><td>${esc(u.name)}</td><td>${u.username ? '@' + esc(u.username) : ''}</td><td>${esc(u.phone)}</td><td>${new Date(u.created_at * 1000).toLocaleDateString()}</td>
    <td><button class="${u.blocked ? 's' : 'd'}" onclick="block(${u.tg_id},${u.blocked ? 0 : 1})">${u.blocked ? 'Blokdan chiqarish' : 'Bloklash'}</button></td></tr>`).join('')}</table></div></div>`);
  },
  async msg() {
    const l = await req('GET', '/movies');
    out(`<h2>📣 Xabar yuborish</h2><div class="panel"><p style="color:var(--m)">Xabar barcha (bloklanmagan) foydalanuvchilarga bot orqali yuboriladi.</p>
    <textarea id="bm" rows="5" placeholder="Xabar matni"></textarea><select id="bmv"><option value="">Kino tugmasi qo'shmaslik</option>${l.map(m => `<option value="${m.id}">${esc(m.title)}</option>`).join('')}</select>
    <button onclick="sendMsg()">📣 Yuborish</button></div>`);
  },
  async subs() {
    const l = await req('GET', '/channels'), s = await req('GET', '/settings');
    out(`<h2>📢 Majburiy obuna</h2><div class="panel"><label class="sw"><input type="checkbox" id="subon" ${s.sub_required === '1' ? 'checked' : ''} onchange="setSet('sub_required',this.checked)"> Majburiy obuna yoqilgan</label>
    <p style="color:var(--m)">O'chiq bo'lsa, foydalanuvchilar kanalga a'zo bo'lmasdan ham kira oladi. Yoqsangiz, bot kanal/guruhda <b>admin</b> bo'lishi shart.</p></div>
    <div class="panel"><div class="row"><input id="sc" placeholder="@kanal yoki -1001234567890"><input id="st" placeholder="Ko'rinadigan nomi"></div><input id="sl" placeholder="Havola (https://t.me/... — yopiq kanal uchun shart)">
    <button onclick="act('POST','/channels',{chat:$('#sc').value,title:$('#st').value,link:$('#sl').value},'subs')">Qo'shish</button>
    <table>${l.map(c => `<tr><td>${esc(c.title)}</td><td>${esc(c.chat)}</td><td><button class="d" onclick="del('/channels/${c.id}','subs')">✕</button></td></tr>`).join('')}</table></div>`);
  },
  async bots() {
    const l = await req('GET', '/bots');
    out(`<h2>🤖 Botlar</h2><div class="panel"><input id="bt" placeholder="Yangi bot tokeni (BotFather'dan)"><button onclick="act('POST','/bots',{token:$('#bt').value},'bots')">Bot qo'shish</button></div>
    ${l.map(b => `<div class="panel"><b>@${esc(b.username)}</b> (id ${b.id})<textarea id="bw${b.id}" rows="3">${esc(b.welcome)}</textarea><input id="bb${b.id}" value="${esc(b.button)}">
    <button onclick="act('PUT','/bots/${b.id}',{welcome:$('#bw${b.id}').value,button:$('#bb${b.id}').value},'bots')">Saqlash</button>
    <button class="s" onclick="act('PUT','/bots/${b.id}',{active:${b.active ? 0 : 1}},'bots')">${b.active ? "O'chirish" : 'Yoqish'}</button> <button class="d" onclick="del('/bots/${b.id}','bots')">✕</button></div>`).join('')}`);
  },
  async admins() {
    const l = await req('GET', '/admins');
    out(`<h2>🛡 Adminlar</h2><div class="panel"><p style="color:var(--m)">Yordamchi admin kino, kategoriya, reklama va to'lovlarni boshqara oladi. Foydalanuvchilar, botlar, obuna, sozlamalar va adminlar faqat bosh adminda.</p>
    <div class="row"><input id="an" placeholder="Yangi yordamchi logini" autocapitalize="none"><input id="ap" type="password" placeholder="Parol (8+ belgi)"></div>
    <button onclick="act('POST','/admins',{username:$('#an').value,password:$('#ap').value},'admins')">Yordamchi qo'shish</button></div>
    <div class="panel tw"><table>${l.map(a => `<tr><td>${esc(a.username)}</td><td>${a.role === 'super' ? 'bosh admin' : 'yordamchi'}</td><td style="text-align:right">${a.role === 'super' ? '' : `<button class="s" onclick="resetAdm(${a.id})">Parol</button> <button class="d" onclick="del('/admins/${a.id}','admins')">✕</button>`}</td></tr>`).join('')}</table></div>`);
  },
  async settings() {
    const s = await req('GET', '/settings');
    out(`<h2>⚙️ Sozlamalar</h2><div class="panel">
    <label class="sw"><input type="checkbox" ${s.phone_required === '1' ? 'checked' : ''} onchange="setSet('phone_required',this.checked)"> Telefon raqami majburiy</label>
    <label class="sw"><input type="checkbox" ${s.sub_required === '1' ? 'checked' : ''} onchange="setSet('sub_required',this.checked)"> Majburiy obuna yoqilgan</label>
    <label class="sw"><input type="checkbox" ${s.intro_on !== '0' ? 'checked' : ''} onchange="setSet('intro_on',this.checked)"> Har bir kino boshida intro video qo'yilsin</label></div>`);
  },
  acc() {
    out(`<h2>🔐 Hisob</h2><div class="panel" style="max-width:420px"><input id="ac" type="password" placeholder="Joriy parol"><input id="au" placeholder="Yangi login" value="${esc(ME.username)}" autocapitalize="none"><input id="ap" type="password" placeholder="Yangi parol (8+ belgi)">
    <button onclick="chAcc()">O'zgartirish</button></div>`);
  }
};
async function act(m, p, b, k) { try { await req(m, p, b); toast('✅ Bajarildi'); go(k); } catch (e) {} }
async function del(p, k) { if (confirm("O'chirilsinmi?")) act('DELETE', p, null, k); }
function block(id, v) { act('POST', `/users/${id}/block`, { blocked: v }, 'users'); }
async function setSet(k, v) { try { await req('POST', '/settings', { [k]: v }); toast('✅ Saqlandi'); } catch (e) {} }
function resetAdm(id) { const p = prompt('Yangi parol (8+ belgi)'); if (p) act('PUT', '/admins/' + id, { password: p }, 'admins'); }
async function sendMsg() {
  const text = $('#bm').value.trim(); if (!text) return toast('Matn yozing');
  if (!confirm('Hamma foydalanuvchiga yuborilsinmi?')) return;
  try { const r = await req('POST', '/broadcast', { text, movieId: $('#bmv').value }); toast('📣 Yuborish boshlandi: ' + r.total + ' ta'); $('#bm').value = ''; } catch (e) {}
}
async function saveMovie() {
  if (!$('#mt').value.trim()) return toast('Nomini yozing');
  const fd = new FormData();
  [['title', 'mt'], ['year', 'my'], ['category_id', 'mc'], ['type', 'mtype'], ['price', 'mp'], ['description', 'md']].forEach(([k, i]) => fd.append(k, $('#' + i).value));
  fd.append('allow_download', $('#mdl').checked ? '1' : '0'); fd.append('featured', $('#mft').checked ? '1' : '0');
  if ($('#mpo').files[0]) fd.append('poster', $('#mpo').files[0]);
  const vid = $('#mv').files[0], notify = $('#mnf').checked;
  $('#msave').disabled = true;
  try {
    const r = await upload('/movies', fd);
    if (vid) await uploadVideo(vid, r.id, $('#mn').value, { first: true, notify }, p => $('#mbar').style.width = p + '%');
    toast('✅ Saqlandi'); go('movies');
  } catch (e) { toast('Yuklashda xato'); $('#msave').disabled = false; }
}
function addEp(id) {
  const n = prompt('Qism raqami?'); if (!n) return;
  const i = document.createElement('input'); i.type = 'file'; i.accept = 'video/*';
  i.onchange = async () => { toast('Yuklanmoqda...'); try { await uploadVideo(i.files[0], id, n, {}, p => toast('Yuklanmoqda ' + p + '%')); toast("✅ Qism qo'shildi"); go('movies'); } catch (e) { toast('Xato'); } };
  i.click();
}
async function showEps(id) {
  const l = await req('GET', '/movies/' + id + '/episodes');
  modal(`<h3 style="margin-top:0">🎞 Qismlar</h3>${l.map(e => `<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0"><span>${e.number}-qism</span><button class="d" onclick="delEp(${e.id},${id})">✕</button></div>`).join('') || "<p>Qism yo'q</p>"}<button class="s" onclick="closeModal()">Yopish</button>`);
}
async function delEp(eid, mid) { if (!confirm("O'chirilsinmi?")) return; await req('DELETE', '/episodes/' + eid); showEps(mid); }
async function editMovie(id) {
  const [cats, list] = await Promise.all([req('GET', '/categories'), req('GET', '/movies')]);
  const m = list.find(x => x.id === id); if (!m) return;
  modal(`<h3 style="margin-top:0">✏️ Tahrirlash</h3><input id="et" value="${esc(m.title)}"><div class="row"><input id="ey" type="number" value="${m.year || ''}" placeholder="Yili"><input id="ep" type="number" value="${m.price}" placeholder="Narxi"></div>
  <select id="ec"><option value="">Kategoriya</option>${cats.map(c => `<option value="${c.id}" ${c.id === m.category_id ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}</select>
  <textarea id="ed" rows="4">${esc(m.description)}</textarea><label><input type="checkbox" id="edl" ${m.allow_download ? 'checked' : ''}>Yuklab olish mumkin</label><br><label><input type="checkbox" id="eft" ${m.featured ? 'checked' : ''}>Bosh sahifada katta (hero)</label><p>🖼 Yangi poster: <input id="epo" type="file" accept="image/*"></p>
  <button onclick="saveEdit(${id})">Saqlash</button> <button class="s" onclick="closeModal()">Bekor</button>`);
}
async function saveEdit(id) {
  const fd = new FormData();
  fd.append('title', $('#et').value); fd.append('year', $('#ey').value); fd.append('price', $('#ep').value); fd.append('category_id', $('#ec').value);
  fd.append('description', $('#ed').value); fd.append('allow_download', $('#edl').checked ? '1' : '0'); fd.append('featured', $('#eft').checked ? '1' : '0');
  if ($('#epo').files[0]) fd.append('poster', $('#epo').files[0]);
  const r = await fetch(B + '/api/movies/' + id, { method: 'PUT', body: fd });
  if (!r.ok) return toast('Xato'); closeModal(); toast('✅ Saqlandi'); go('movies');
}
async function addBanner() {
  const f = $('#bf').files[0]; if (!f) return toast('Fayl tanlang');
  const fd = new FormData(); fd.append('file', f); fd.append('link', $('#bl').value); fd.append('place', $('#bp').value);
  toast('Yuklanmoqda...'); try { await upload('/banners', fd, p => toast('Yuklanmoqda ' + p + '%')); go('banners'); } catch (e) { toast('Xato'); }
}
async function chAcc() {
  try { await req('POST', '/account', { current: $('#ac').value, username: $('#au').value, password: $('#ap').value }); toast('✅ Qayta kiring'); setTimeout(showLogin, 800); } catch (e) {}
}
start();
</script></body></html>
