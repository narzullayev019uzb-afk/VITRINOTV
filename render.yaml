services:
  - type: web
    name: vitrino-tv
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: BOT_TOKEN
        sync: false
      - key: BASE_URL
        sync: false
      - key: ADMIN_PATH
        sync: false
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASS
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_KEY
        sync: false
      - key: S3_SECRET
        sync: false
      - key: S3_REGION
        value: auto
      - key: SESSION_SECRET
        generateValue: true
