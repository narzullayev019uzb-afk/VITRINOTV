<!doctype html>
<html lang="uz"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#050d08">
<title>VITRINO TV</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--g:#39ff14;--g2:#9dff00;--bg:#050d08;--c:rgba(255,255,255,.06);--b:rgba(120,255,160,.14);--t:#eafff1;--m:#8fb39b;--gold:#ffd24a;--r:#ff5468;--st:env(safe-area-inset-top);--sb:env(safe-area-inset-bottom)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
html,body{margin:0;background:var(--bg);color:var(--t);font:15px/1.4 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
body{background:radial-gradient(900px 480px at 50% -10%,#0f4a22 0,transparent 60%),var(--bg);padding-bottom:calc(92px + var(--sb));min-height:100dvh;overflow-x:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none}
input{font-size:16px}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.f{fill:currentColor;stroke:none}
@keyframes pop{from{transform:scale(.6);opacity:0;filter:blur(12px)}to{transform:none;opacity:1;filter:none}}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes shine{to{background-position:-200% 0}}
@keyframes pulse{50%{opacity:.35;transform:scale(.7)}}
@keyframes spin{to{transform:rotate(360deg)}}
#splash{position:fixed;inset:0;background:#050d08;display:grid;place-items:center;z-index:99;transition:opacity .5s,visibility .5s}
#splash.hide{opacity:0;visibility:hidden}
#splash img{width:86%;max-width:420px;border-radius:24px;animation:pop 1s cubic-bezier(.2,.9,.2,1) both;box-shadow:0 0 80px rgba(57,255,20,.35)}
header{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:10px;padding:calc(10px + var(--st)) 16px 10px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);background:rgba(5,13,8,.75);border-bottom:1px solid var(--b)}
.logo{font-weight:900;font-size:21px;font-style:italic;letter-spacing:.5px}
.logo b{color:var(--g);text-shadow:0 0 14px rgba(57,255,20,.7)}
#online{margin-left:auto;font-size:12px;color:var(--m);display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:99px;background:var(--c)}
#online:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--g);box-shadow:0 0 10px var(--g);animation:pulse 1.6s infinite}
.search{margin:14px 16px 6px;display:flex;align-items:center;gap:10px;padding:0 14px;height:48px;border-radius:16px;background:var(--c);border:1px solid var(--b);transition:.3s;color:var(--m)}
.search:focus-within{border-color:var(--g);box-shadow:0 0 0 3px rgba(57,255,20,.12)}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--t)}
.ban{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:10px 16px;scrollbar-width:none}
.ban::-webkit-scrollbar,.rail::-webkit-scrollbar,.chips::-webkit-scrollbar{display:none}
.b{flex:0 0 88%;aspect-ratio:16/8;border-radius:20px;overflow:hidden;scroll-snap-align:center;box-shadow:0 12px 30px rgba(57,255,20,.15);border:1px solid var(--b)}
.b img,.b video{width:100%;height:100%;object-fit:cover;display:block}
.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 16px;scrollbar-width:none}
.chip{flex:none;height:38px;padding:0 16px;border-radius:99px;background:var(--c);border:1px solid var(--b);color:var(--m);transition:.25s;white-space:nowrap}
.chip.on{background:linear-gradient(135deg,var(--g),var(--g2));color:#031a08;font-weight:800;box-shadow:0 6px 20px rgba(57,255,20,.35)}
h2{margin:16px 16px 10px;font-size:18px}
.rail{display:flex;gap:12px;overflow-x:auto;padding:0 16px 6px;scrollbar-width:none}
.rail .card{flex:0 0 132px}
.g{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;padding:0 16px}
@media(min-width:520px){.g{grid-template-columns:repeat(3,1fr)}}
.card{position:relative;border-radius:18px;overflow:hidden;background:var(--c);border:1px solid var(--b);animation:up .45s both;animation-delay:calc(var(--i,0)*40ms);transition:transform .15s;cursor:pointer}
.card:active{transform:scale(.95)}
.pw{position:relative}
.card .p,.card .ph{aspect-ratio:2/3;width:100%;object-fit:cover;display:block;background:#0b1a11}
.card .ph{display:grid;place-items:center;font-size:40px}
.wm{position:absolute;pointer-events:none;opacity:.8;filter:drop-shadow(0 2px 6px rgba(0,0,0,.7))}
.pw .wm{right:8px;bottom:8px;width:46%}
.card .in{padding:9px 11px}
.card .in b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .in small{color:var(--m)}
.tag{position:absolute;top:9px;left:9px;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:800;background:var(--g);color:#031a08}
.tag.paid{background:var(--gold)}
.tag.ser{left:auto;right:9px;background:rgba(0,0,0,.65);color:#fff}
.rank{position:absolute;left:8px;bottom:8px;font-size:34px;font-weight:900;font-style:italic;color:#fff;text-shadow:0 2px 10px #000;line-height:1}
.pbar{height:4px;background:rgba(255,255,255,.2)}
.pbar i{display:block;height:100%;background:var(--g)}
.sk{border-radius:18px;aspect-ratio:2/3;background:linear-gradient(110deg,#0b1a11 30%,#15301f 50%,#0b1a11 70%);background-size:200% 100%;animation:shine 1.3s infinite}
.empty{grid-column:1/-1;text-align:center;color:var(--m);padding:40px 20px}
nav{position:fixed;left:12px;right:12px;bottom:calc(10px + var(--sb));z-index:20;display:flex;padding:6px;border-radius:24px;background:rgba(10,24,15,.9);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--b);box-shadow:0 10px 40px rgba(0,0,0,.6);transition:transform .3s}
nav.gone{transform:translateY(140%)}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:50px;justify-content:center;border-radius:18px;color:var(--m);font-size:11px;font-weight:700;transition:.25s}
nav button.on{color:#031a08;background:linear-gradient(135deg,var(--g),var(--g2));box-shadow:0 6px 18px rgba(57,255,20,.4)}
.sheet{position:fixed;inset:0;z-index:50;background:var(--bg);transform:translateY(100%);transition:transform .4s cubic-bezier(.2,.9,.2,1);overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet.open{transform:none}
.hero{position:relative;height:54vh;min-height:300px;overflow:hidden;background:#0b1a11}
.hero>img.bg{width:100%;height:100%;object-fit:cover}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.45),transparent 30%,var(--bg))}
.hero .wm{top:calc(14px + var(--st));left:68px;width:88px;z-index:3}
.round{width:44px;height:44px;border-radius:50%;background:rgba(0,0,0,.55);backdrop-filter:blur(10px);display:grid;place-items:center;color:#fff}
.round.on{color:var(--r)}
.topbtns{position:absolute;z-index:4;top:calc(12px + var(--st));left:14px;right:14px;display:flex;gap:10px}
.topbtns .sp{flex:1}
.det{padding:0 18px 30px;margin-top:-70px;position:relative;z-index:2;animation:up .4s both}
.det h1{margin:0 0 8px;font-size:26px;line-height:1.15}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.meta span{padding:5px 11px;border-radius:99px;background:var(--c);border:1px solid var(--b);font-size:12px;color:var(--m)}
.desc{color:#cfe8d6;margin:10px 0 16px}
.mut{color:var(--m)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 20px;border-radius:16px;font-weight:800;transition:transform .15s;width:100%}
.btn:active{transform:scale(.97)}
.btn.pri{background:linear-gradient(135deg,var(--g),var(--g2));color:#031a08;box-shadow:0 8px 24px rgba(57,255,20,.35)}
.btn.sec{background:var(--c);border:1px solid var(--b)}
.row2{display:flex;gap:10px;margin-top:10px}
.eplist{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.er{display:flex;gap:8px;align-items:stretch}
.er .play{flex:1;min-height:48px;padding:0 14px;border-radius:14px;background:var(--c);border:1px solid var(--b);display:flex;align-items:center;gap:10px;text-align:left;position:relative;overflow:hidden}
.er .play i{position:absolute;left:0;bottom:0;height:3px;background:var(--g)}
.er .dl{width:48px;border-radius:14px;background:var(--c);border:1px solid var(--b);display:grid;place-items:center}
.note,.pay{padding:16px;border-radius:18px;background:var(--c);border:1px solid var(--b);margin-top:16px}
.pm{padding:12px;margin:10px 0;border-radius:14px;background:rgba(255,255,255,.04)}
.cardno{font-size:19px;font-weight:800;letter-spacing:1px;color:var(--gold);margin:4px 0;word-break:break-all}
.up{display:block;padding:14px;border:1px dashed var(--g);border-radius:14px;text-align:center;margin-top:10px;color:var(--g)}
.lock{padding:30px 20px;text-align:center;animation:up .4s both}
.lock h2{margin:10px 0}
.lk{display:block;padding:15px;margin:10px 0;border-radius:16px;background:var(--c);border:1px solid var(--b);color:var(--t);text-decoration:none;font-weight:700}
.dr{display:flex;gap:12px;margin:0 16px 14px;padding:12px;border-radius:18px;background:var(--c);border:1px solid var(--b)}
.dr img,.dr .ph{width:64px;height:96px;border-radius:12px;object-fit:cover;flex:none;background:#0b1a11;display:grid;place-items:center}
.dr .x{flex:1;min-width:0}
.dr b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dl2{display:flex;align-items:center;gap:8px;margin-top:8px;min-height:40px;padding:0 12px;border-radius:12px;background:rgba(57,255,20,.1);border:1px solid var(--b);width:100%;font-size:13px;font-weight:700}
.prof{padding:20px 16px;text-align:center}
.av{width:84px;height:84px;border-radius:50%;margin:0 auto 10px;display:grid;place-items:center;font-size:34px;font-weight:900;color:#031a08;background:linear-gradient(135deg,var(--g),var(--g2));box-shadow:0 0 30px rgba(57,255,20,.35)}
.stats{display:flex;gap:10px;margin:16px 16px}
.stats div{flex:1;padding:14px 6px;border-radius:16px;background:var(--c);border:1px solid var(--b);text-align:center}
.stats b{display:block;font-size:22px;color:var(--g)}
.stats small{color:var(--m)}
.st2{display:inline-block;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:800}
.st2.approved{background:rgba(57,255,20,.18);color:var(--g)}.st2.pending{background:rgba(255,210,74,.18);color:var(--gold)}.st2.rejected{background:rgba(255,84,104,.18);color:var(--r)}
#player{position:fixed;inset:0;background:#000;z-index:60;display:none;user-select:none;-webkit-user-select:none}
#player.open{display:block}
#player video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
#player .wm{top:calc(14px + var(--st));right:16px;width:100px;opacity:.6;z-index:2}
.tap{position:absolute;inset:0;z-index:3}
.pc{position:absolute;inset:0;z-index:4;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;background:linear-gradient(rgba(0,0,0,.7),transparent 28%,transparent 62%,rgba(0,0,0,.8));transition:opacity .25s}
.pc.hide{opacity:0}
.pc.hide *{pointer-events:none!important}
.pc button,.pc input{pointer-events:auto}
.pt{display:flex;align-items:center;gap:10px;padding:calc(10px + var(--st)) 14px 0;padding-right:130px}
.pt b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pm2{display:flex;justify-content:center;align-items:center;gap:26px}
.pm2 .sk10{width:56px;height:56px;border-radius:50%;background:rgba(0,0,0,.5);font-weight:800;font-size:14px}
.pm2 .pp{width:76px;height:76px;border-radius:50%;background:rgba(57,255,20,.92);color:#031a08;display:grid;place-items:center;box-shadow:0 0 30px rgba(57,255,20,.5)}
.pm2 .pp svg{width:34px;height:34px}
.pb{padding:0 16px calc(12px + var(--sb))}
.tm{display:flex;align-items:center;gap:10px;font-size:13px;font-variant-numeric:tabular-nums}
#sk{flex:1;-webkit-appearance:none;appearance:none;height:5px;border-radius:5px;background:linear-gradient(to right,var(--g) var(--p,0%),rgba(255,255,255,.28) var(--p,0%));outline:0;margin:0}
#sk::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--g);box-shadow:0 0 10px var(--g)}
#sk::-moz-range-thumb{width:18px;height:18px;border:0;border-radius:50%;background:var(--g)}
.pr{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.pr button{min-width:48px;height:44px;padding:0 12px;border-radius:12px;font-weight:800;display:flex;align-items:center;gap:6px;justify-content:center}
.flash{position:absolute;top:50%;transform:translateY(-50%);z-index:5;padding:14px 18px;border-radius:99px;background:rgba(0,0,0,.6);font-weight:800;pointer-events:none;animation:up .2s both}
.spin{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px;border:4px solid rgba(255,255,255,.2);border-top-color:var(--g);border-radius:50%;animation:spin .8s linear infinite;z-index:2;display:none}
#toast{position:fixed;top:calc(14px + var(--st));left:50%;transform:translate(-50%,-140px);z-index:100;padding:12px 20px;border-radius:99px;background:var(--g);color:#031a08;font-weight:800;transition:.4s cubic-bezier(.2,.9,.2,1);max-width:90%;text-align:center}
#toast.show{transform:translate(-50%,0)}
</style></head><body>
<div id="splash"><img src="/logo.png" alt="VITRINO TV"></div>
<header><div class="logo">VITRINO<b>TV</b></div><div id="online">jonli</div></header>
<main id="view"></main>
<nav id="nav">
<button data-act="tab" data-t="home" class="on"><svg class="i" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Bosh</button>
<button data-act="tab" data-t="favs"><svg class="i" viewBox="0 0 24 24"><path d="M12 21s-8-4.9-9.5-10C1.4 7.3 3.6 4.5 6.6 4.5c2 0 3.5 1 5.4 3 1.9-2 3.4-3 5.4-3 3 0 5.2 2.8 4.1 6.5C20 16.100 12 21 12 21z"/></svg>Sevimli</button>
<button data-act="tab" data-t="dl"><svg class="i" viewBox="0 0 24 24"><path d="M12 3v12m0 0-4.500-4.500M12 15l4.500-4.500M4 20h16"/></svg>Yuklamalar</button>
<button data-act="tab" data-t="me"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>Profil</button>
</nav>
<div id="sheet" class="sheet"></div>
<div id="player"></div>
<div id="toast"></div>
<script>
const tg = window.Telegram.WebApp; tg.ready(); tg.expand();
try { tg.setHeaderColor('#050d08'); tg.setBackgroundColor('#050d08'); tg.setBottomBarColor && tg.setBottomBarColor('#050d08'); } catch (e) {}
const QS = new URLSearchParams(location.search);
const BOT = QS.get('b') || 1;
let M0 = QS.get('m');
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = p => p ? Number(p).toLocaleString('ru') + " so'm" : 'BEPUL';
const fmtT = s => { s = Math.max(0, Math.floor(s || 0)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(x).padStart(2, '0'); };
const fmtS = b => b > 1e9 ? (b / 1e9).toFixed(1) + ' GB' : (b / 1e6).toFixed(0) + ' MB';
const hap = (s) => { try { tg.HapticFeedback.impactOccurred(s || 'light'); } catch (e) {} };
const ICON = {
  play: '<svg class="i f" viewBox="0 0 24 24"><path d="M7 4.500v15l13-7.500z"/></svg>',
  pause: '<svg class="i f" viewBox="0 0 24 24"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>',
  dl: '<svg class="i" viewBox="0 0 24 24"><path d="M12 3v12m0 0-4.500-4.500M12 15l4.500-4.500M4 20h16"/></svg>',
  back: '<svg class="i" viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></svg>',
  close: '<svg class="i" viewBox="0 0 24 24"><path d="M5 5l14 14M19 5 5 19"/></svg>',
  heart: '<svg class="i" viewBox="0 0 24 24"><path d="M12 21s-8-4.900-9.500-10C1.400 7.300 3.600 4.500 6.600 4.500c2 0 3.500 1 5.400 3 1.900-2 3.400-3 5.400-3 3 0 5.200 2.800 4.100 6.500C20 16.100 12 21 12 21z"/></svg>',
  share: '<svg class="i" viewBox="0 0 24 24"><path d="M12 3v12M8 7l4-4 4 4M5 12v8h14v-8"/></svg>',
  fs: '<svg class="i" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>',
  search: '<svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.500-3.500"/></svg>'
};
let TAB = 'home', Q = '', CAT = '', HB = null, bannerTimer = null;

async function api(p, opt = {}) {
  const r = await fetch('/api' + p, { ...opt, headers: { 'x-init': tg.initData, 'x-bot': BOT, ...(opt.headers || {}) } });
  if (r.status === 403) { document.body.innerHTML = '<div class="lock"><h2>🚫 Siz bloklangansiz</h2></div>'; throw 0; }
  if (!r.ok) throw await r.json().catch(() => ({}));
  return r.json();
}
function toast(t) { const e = $('#toast'); e.textContent = t; e.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove('show'), 2600); }
function skel(n) { return '<div class="g" style="margin-top:16px">' + '<div class="sk"></div>'.repeat(n || 6) + '</div>'; }
function card(m, i, o) {
  o = o || {};
  const pw = m.poster ? `<div class="pw"><img class="p" loading="lazy" decoding="async" src="/files/${esc(m.poster)}"><img class="wm" src="/watermark.png"></div>` : '<div class="ph">🎬</div>';
  const bar = o.prog ? `<div class="pbar"><i style="width:${Math.min(100, m.pos / m.dur * 100)}%"></i></div>` : '';
  return `<div class="card" style="--i:${i % 12}" data-act="open" data-id="${m.id}">${pw}
    <span class="tag ${m.price ? 'paid' : ''}">${fmt(m.price)}</span>${m.type === 'series' ? '<span class="tag ser">SERIAL</span>' : ''}${o.rank ? `<span class="rank">${o.rank}</span>` : ''}
    ${bar}<div class="in"><b>${esc(m.title)}</b><small>${m.year || ''}${m.cat ? ' • ' + esc(m.cat) : ''}</small></div></div>`;
}

/* ---------- tablar ---------- */
function setTab(t) {
  TAB = t; hap();
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.t === t));
  $('#view').innerHTML = ''; window.scrollTo(0, 0);
  ({ home: loadHome, favs: loadFavs, dl: loadDl, me: loadMe })[t]();
}
async function loadHome() {
  if (!$('#gd')) $('#view').innerHTML = skel(6);
  let d; try { d = await api(`/home?q=${encodeURIComponent(Q)}&cat=${CAT}`); } catch (e) { return toast('Ulanishda xatolik'); }
  if (d.missing.length) return lockSub(d.missing);
  if (d.needPhone) return lockPhone();
  if (!$('#gd')) {
    $('#view').innerHTML = `<div class="search">${ICON.search}<input id="si" placeholder="Kino qidirish..." value="${esc(Q)}" enterkeyhint="search"></div>
    <div class="ban" id="bn"></div><div class="chips" id="ch"></div><div id="co"></div><div id="tp"></div><h2 id="gt">🆕 Yangi kinolar</h2><div class="g" id="gd"></div>`;
    let tm; $('#si').oninput = e => { clearTimeout(tm); tm = setTimeout(() => { Q = e.target.value.trim(); loadHome(); }, 350); };
  }
  if (d.banners) HB = d.banners;
  const filt = !!(Q || CAT);
  const bn = $('#bn');
  bn.style.display = filt || !HB.length ? 'none' : 'flex';
  if (!filt && !bn.dataset.k) {
    bn.dataset.k = 1;
    bn.innerHTML = HB.map(b => `<div class="b" ${b.link ? `data-act="link" data-u="${esc(b.link)}"` : ''}>${b.kind === 'video' ? `<video src="/files/${esc(b.file)}" autoplay muted loop playsinline></video>` : `<img src="/files/${esc(b.file)}" alt="">`}</div>`).join('');
    clearInterval(bannerTimer);
    bannerTimer = setInterval(() => { if (HB && HB.length > 1 && TAB === 'home') { const w = bn.clientWidth * .88 + 12; bn.scrollTo({ left: bn.scrollLeft + w >= bn.scrollWidth - 20 ? 0 : bn.scrollLeft + w, behavior: 'smooth' }); } }, 4500);
  }
  $('#ch').innerHTML = `<button class="chip ${CAT ? '' : 'on'}" data-act="cat" data-id="">Hammasi</button>` + d.categories.map(c => `<button class="chip ${CAT == c.id ? 'on' : ''}" data-act="cat" data-id="${c.id}">${esc(c.name)}</button>`).join('');
  $('#co').innerHTML = !filt && d.cont && d.cont.length ? `<h2>▶ Davom ettirish</h2><div class="rail">${d.cont.map((m, i) => card(m, i, { prog: 1 })).join('')}</div>` : '';
  $('#tp').innerHTML = !filt && d.top && d.top.length ? `<h2>🔥 Ko'p ko'rilgan</h2><div class="rail">${d.top.map((m, i) => card(m, i, { rank: i + 1 })).join('')}</div>` : '';
  $('#gt').style.display = filt ? 'none' : '';
  $('#gd').innerHTML = d.movies.map((m, i) => card(m, i)).join('') || '<div class="empty">Hech narsa topilmadi 🎬</div>';
}
async function loadFavs() {
  $('#view').innerHTML = '<h2>❤️ Sevimlilar</h2>' + skel(4);
  const d = await api('/favs');
  $('#view').innerHTML = '<h2>❤️ Sevimlilar</h2><div class="g">' + (d.map((m, i) => card(m, i)).join('') || '<div class="empty">Hali sevimli kino yo\'q.<br>Kino sahifasida ❤️ bosing.</div>') + '</div>';
}
async function loadDl() {
  $('#view').innerHTML = '<h2>⬇ Yuklamalar</h2><p class="mut" style="margin:0 16px 14px">Kinolarni telefoningizga yuklab oling va internetsiz ko\'ring.</p>' + skel(2);
  const d = await api('/downloads');
  $('#view').innerHTML = '<h2>⬇ Yuklamalar</h2><p class="mut" style="margin:0 16px 14px">Kinolarni telefoningizga yuklab oling va internetsiz ko\'ring.</p>' +
    (d.map(m => `<div class="dr">${m.poster ? `<img loading="lazy" src="/files/${esc(m.poster)}">` : '<div class="ph">🎬</div>'}<div class="x"><b>${esc(m.title)}</b><small class="mut">${m.year || ''}${m.type === 'series' ? ' • Serial' : ''}</small>
    ${m.eps.map(e => `<button class="dl2" data-act="dl" data-id="${e.id}" data-t="${esc(m.title)}" data-n="${e.number}">${ICON.dl}<span>${m.type === 'series' ? e.number + '-qism' : 'Yuklab olish'}</span><span class="mut" style="margin-left:auto">${e.size ? fmtS(e.size) : ''}</span></button>`).join('')}</div></div>`).join('') || '<div class="empty">Yuklab olish mumkin kino hali yo\'q</div>');
}
async function loadMe() {
  $('#view').innerHTML = skel(2);
  const d = await api('/profile'), u = d.user || {};
  const ST = { approved: 'Tasdiqlangan', pending: 'Kutilmoqda', rejected: 'Rad etilgan' };
  $('#view').innerHTML = `<div class="prof"><div class="av">${esc((u.name || '?').trim().charAt(0).toUpperCase())}</div><h2 style="margin:0">${esc(u.name)}</h2>
  <div class="mut">${u.username ? '@' + esc(u.username) : ''} ${u.phone ? '• ' + esc(u.phone) : ''}</div></div>
  <div class="stats"><div><b>${d.watched}</b><small>Ko'rilgan</small></div><div><b>${d.favs}</b><small>Sevimli</small></div><div><b>${d.bought.filter(x => x.st === 'approved').length}</b><small>Xarid</small></div></div>
  <h2>💳 Xaridlar</h2><div class="g">${d.bought.map((m, i) => card(m, i)).join('') || '<div class="empty">Hali xarid yo\'q</div>'}</div>`;
  document.querySelectorAll('#view .card').forEach((c, i) => { const b = d.bought[i]; if (b) c.insertAdjacentHTML('beforeend', `<span class="st2 ${b.st}" style="position:absolute;top:34px;left:9px">${ST[b.st] || ''}</span>`); });
}
function lockSub(ch) {
  $('#view').innerHTML = `<div class="lock"><div style="font-size:60px">🔒</div><h2>Davom etish uchun obuna bo'ling</h2><p class="mut">Kanal/guruhlarga a'zo bo'ling va «Tekshirish» ni bosing</p>
  ${ch.map(c => `<a class="lk" href="#" data-act="tglink" data-u="${esc(c.link)}">📢 ${esc(c.title)}</a>`).join('')}<button class="btn pri" data-act="reload">✅ Tekshirish</button></div>`;
}
function lockPhone() {
  $('#view').innerHTML = `<div class="lock"><div style="font-size:60px">📱</div><h2>Telefon raqamingiz kerak</h2><p class="mut">Davom etish uchun raqamingizni ulashing</p><button class="btn pri" data-act="phone">📱 Raqamni yuborish</button></div>`;
}

/* ---------- kino sahifasi ---------- */
let MV = null;
function mins(p) { return p && p.dur && p.pos > 20 && p.pos < p.dur - 30; }
async function openMovie(id) {
  hap();
  const S = $('#sheet'); S.classList.add('open'); S.scrollTop = 0;
  S.innerHTML = '<div class="hero"></div><div class="det"><div class="sk" style="aspect-ratio:3/1"></div></div>';
  tg.BackButton.show(); $('#nav').classList.add('gone');
  let d; try { d = await api('/movie/' + id); } catch (e) { return closeSheet(); }
  MV = d; renderMovie();
}
function renderMovie() {
  const d = MV, m = d.movie, S = $('#sheet'), eps = d.episodes;
  let act = '';
  if (d.owned) {
    if (!eps.length) act = '<div class="note mut">Video hali yuklanmagan</div>';
    else {
      let last = null;
      eps.forEach(e => { const p = d.prog[e.id]; if (mins(p) && !last) last = { e, p }; });
      const cta = last ? `<button class="btn pri" data-act="play" data-id="${last.e.id}">${ICON.play}Davom ettirish ${m.type === 'series' ? last.e.number + '-qism ' : ''}${fmtT(last.p.pos)}</button>`
        : `<button class="btn pri" data-act="play" data-id="${eps[0].id}">${ICON.play}${m.type === 'series' ? '1-qismdan boshlash' : "Ko'rish"}</button>`;
      act = cta;
      if (m.type !== 'series') act += m.allow_download ? `<div class="row2"><button class="btn sec" data-act="dl" data-id="${eps[0].id}" data-t="${esc(m.title)}" data-n="1">${ICON.dl}Yuklab olish</button></div>` : '';
      else act += `<div class="eplist">${eps.map(e => { const p = d.prog[e.id]; const pc = p && p.dur ? Math.min(100, p.pos / p.dur * 100) : 0;
        return `<div class="er"><button class="play" data-act="play" data-id="${e.id}">${ICON.play}<b>${e.number}-qism</b>${pc > 95 ? '<span class="mut" style="margin-left:auto">✓ ko\'rilgan</span>' : ''}<i style="width:${pc}%"></i></button>${m.allow_download ? `<button class="dl" data-act="dl" data-id="${e.id}" data-t="${esc(m.title)}" data-n="${e.number}">${ICON.dl}</button>` : ''}</div>`; }).join('')}</div>`;
    }
  } else if (d.pending) act = '<div class="note">⏳ To\'lovingiz tekshirilmoqda. Tasdiqlangach xabar keladi.</div>';
  else act = `<div class="pay"><h3 style="margin:0 0 6px">💳 To'lov: ${fmt(m.price)}</h3><p class="mut" style="margin:0">Kartaga to'lang va chek rasmini yuboring.</p>
    ${d.pay.map(p => `<div class="pm"><b>${esc(p.name)}</b><div class="cardno" data-act="copy" data-c="${esc(p.card)}">${esc(p.card)} 📋</div><small class="mut">${esc(p.holder)} ${esc(p.note)}</small></div>`).join('') || '<p class="mut">To\'lov usullari hali qo\'shilmagan</p>'}
    <label class="up"><span id="rcn">📎 Chek rasmini tanlang</span><input type="file" id="rc" accept="image/*" hidden></label>
    <button class="btn pri" style="margin-top:12px" data-act="buy" data-id="${m.id}">Chekni yuborish</button></div>`;
  S.innerHTML = `<div class="hero">${m.poster ? `<img class="bg" src="/files/${esc(m.poster)}">` : ''}<img class="wm" src="/watermark.png">
    <div class="topbtns"><button class="round" data-act="closesheet">${ICON.back}</button><span class="sp"></span><button class="round ${d.fav ? 'on' : ''}" data-act="fav" data-id="${m.id}">${ICON.heart}</button><button class="round" data-act="share" data-id="${m.id}">${ICON.share}</button></div></div>
    <div class="det"><h1>${esc(m.title)}</h1><div class="meta">${m.year ? `<span>${m.year}</span>` : ''}${m.cat ? `<span>${esc(m.cat)}</span>` : ''}<span>${m.type === 'series' ? 'Serial' : 'Kino'}</span><span>👁 ${m.views}</span><span>${fmt(m.price)}</span></div>
    ${m.description ? `<p class="desc">${esc(m.description)}</p>` : ''}${act}
    ${d.related.length ? `<h2 style="margin:24px 0 10px">O'xshash kinolar</h2><div class="rail" style="margin:0 -18px;padding:0 18px">${d.related.map((x, i) => card(x, i)).join('')}</div>` : ''}</div>`;
  const rc = $('#rc'); if (rc) rc.onchange = () => { $('#rcn').textContent = '✅ ' + rc.files[0].name; };
}
function closeSheet() { $('#sheet').classList.remove('open'); tg.BackButton.hide(); $('#nav').classList.remove('gone'); MV = null; if (TAB === 'home') loadHome(); }
async function buy(id) {
  const f = $('#rc') && $('#rc').files[0]; if (!f) return toast('Avval chek rasmini tanlang');
  const fd = new FormData(); fd.append('receipt', f);
  try { await api('/buy/' + id, { method: 'POST', body: fd }); toast('✅ Yuborildi'); openMovie(id); } catch (e) { toast(e.error || 'Xatolik'); }
}
async function download(epId, title, num) {
  hap('medium');
  try {
    const p = await api('/play/' + epId); if (!p.dl) return toast('Yuklab olish yopiq');
    const url = location.origin + p.dl, fname = (title + '-' + num + '.mp4').replace(/[^\w.\-]+/g, '_');
    if (tg.downloadFile && tg.isVersionAtLeast && tg.isVersionAtLeast('8.0')) tg.downloadFile({ url, file_name: fname }); else tg.openLink(url);
    toast('⬇ Yuklab olish boshlandi');
  } catch (e) { toast('Xatolik'); }
}

/* ---------- pleyer ---------- */
let PL = null;
async function play(epId) {
  hap();
  let p; try { p = await api('/play/' + epId); } catch (e) { return toast("Ochib bo'lmadi"); }
  const P = $('#player'); PL = { ep: epId, next: p.next, last: 0, hide: null, speed: 1 };
  P.innerHTML = `<video id="vd" src="${p.url}" playsinline webkit-playsinline preload="auto"></video><img class="wm" src="/watermark.png"><div class="spin" id="spin"></div><div class="tap" id="tap"></div>
  <div class="pc" id="pc"><div class="pt"><button class="round" data-act="closep">${ICON.close}</button><b>${esc(p.title)}${p.number > 1 || p.next ? ' • ' + p.number + '-qism' : ''}</b></div>
  <div class="pm2"><button class="sk10" data-act="seek" data-s="-10">−10</button><button class="pp" id="pp" data-act="pp">${ICON.play}</button><button class="sk10" data-act="seek" data-s="10">+10</button></div>
  <div class="pb"><div class="tm"><span id="cur">0:00</span><input id="sk" type="range" min="0" max="1000" value="0"><span id="dur">0:00</span></div>
  <div class="pr"><button data-act="speed" id="spd">1x</button>${p.next ? '<button data-act="nextep">Keyingi ▶</button>' : '<span></span>'}<button data-act="fs">${ICON.fs}</button></div></div></div>`;
  P.classList.add('open'); tg.BackButton.show(); $('#nav').classList.add('gone');
  try { tg.disableVerticalSwipes && tg.disableVerticalSwipes(); } catch (e) {}
  const v = $('#vd'), sk = $('#sk'), spin = $('#spin');
  v.addEventListener('loadedmetadata', () => { $('#dur').textContent = fmtT(v.duration); if (p.pos > 5 && p.pos < v.duration - 15) v.currentTime = p.pos; v.play().catch(() => {}); });
  v.addEventListener('timeupdate', () => {
    if (!v.duration) return; const pc = v.currentTime / v.duration * 100;
    $('#cur').textContent = fmtT(v.currentTime); if (!PL.drag) { sk.value = pc * 10; sk.style.setProperty('--p', pc + '%'); }
    if (Date.now() - PL.last > 10000) { PL.last = Date.now(); saveProg(); }
  });
  v.addEventListener('play', () => { $('#pp').innerHTML = ICON.pause; showCtl(); });
  v.addEventListener('pause', () => { $('#pp').innerHTML = ICON.play; showCtl(true); saveProg(); });
  v.addEventListener('waiting', () => { spin.style.display = 'block'; });
  v.addEventListener('playing', () => { spin.style.display = 'none'; });
  v.addEventListener('ended', () => { saveProg(); if (PL && PL.next) { const n = PL.next; play(n); } });
  v.addEventListener('error', () => toast('Video ochilmadi'));
  sk.addEventListener('input', () => { PL.drag = true; $('#cur').textContent = fmtT(sk.value / 1000 * v.duration); sk.style.setProperty('--p', sk.value / 10 + '%'); });
  sk.addEventListener('change', () => { v.currentTime = sk.value / 1000 * v.duration; PL.drag = false; showCtl(); });
  let lastTap = 0;
  $('#tap').addEventListener('click', e => {
    const t = Date.now(), x = e.clientX / innerWidth;
    if (t - lastTap < 300) { lastTap = 0; const s = x < .4 ? -10 : x > .6 ? 10 : 0; if (s) { seek(s); flash(s); } return; }
    lastTap = t; setTimeout(() => { if (lastTap === t) { $('#pc').classList.contains('hide') ? showCtl() : $('#pc').classList.add('hide'); } }, 300);
  });
  showCtl();
}
function showCtl(keep) { const pc = $('#pc'); if (!pc) return; pc.classList.remove('hide'); clearTimeout(PL.hide); const v = $('#vd'); if (!keep && v && !v.paused) PL.hide = setTimeout(() => pc.classList.add('hide'), 3200); }
function seek(s) { const v = $('#vd'); if (v) { v.currentTime = Math.max(0, Math.min(v.duration || 1e9, v.currentTime + s)); showCtl(); } }
function flash(s) { const el = document.createElement('div'); el.className = 'flash'; el.style[s < 0 ? 'left' : 'right'] = '12%'; el.textContent = s < 0 ? '⏪ 10s' : '10s ⏩'; $('#player').appendChild(el); setTimeout(() => el.remove(), 600); }
function saveProg() {
  const v = $('#vd'); if (!v || !PL || !v.duration) return;
  fetch('/api/progress', { method: 'POST', keepalive: true, headers: { 'content-type': 'application/json', 'x-init': tg.initData, 'x-bot': BOT }, body: JSON.stringify({ ep: PL.ep, pos: v.currentTime, dur: v.duration }) }).catch(() => {});
}
function toggleFs() {
  const P = $('#player'), v = $('#vd'), cur = document.fullscreenElement || document.webkitFullscreenElement;
  if (cur) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); try { screen.orientation.unlock(); } catch (e) {} try { tg.exitFullscreen && tg.exitFullscreen(); } catch (e) {} return; }
  try { tg.requestFullscreen && tg.requestFullscreen(); } catch (e) {}
  if (P.requestFullscreen) P.requestFullscreen().then(() => { try { screen.orientation.lock('landscape'); } catch (e) {} }).catch(() => {});
  else if (P.webkitRequestFullscreen) P.webkitRequestFullscreen();
  else if (v.webkitEnterFullscreen) v.webkitEnterFullscreen();
}
function closePlayer() {
  saveProg();
  const P = $('#player'), v = $('#vd'); if (v) { v.pause(); v.removeAttribute('src'); v.load(); }
  try { if (document.fullscreenElement || document.webkitFullscreenElement) (document.exitFullscreen || document.webkitExitFullscreen).call(document); screen.orientation.unlock(); tg.exitFullscreen && tg.exitFullscreen(); } catch (e) {}
  try { tg.enableVerticalSwipes && tg.enableVerticalSwipes(); } catch (e) {}
  P.innerHTML = ''; P.classList.remove('open'); PL = null;
  if (!$('#sheet').classList.contains('open')) { tg.BackButton.hide(); $('#nav').classList.remove('gone'); }
  else if (MV) openMovie(MV.movie.id);
}
document.addEventListener('visibilitychange', () => { if (document.hidden) saveProg(); });
tg.BackButton.onClick(() => { if ($('#player').classList.contains('open')) closePlayer(); else closeSheet(); });

/* ---------- tugmalar ---------- */
const ACT = {
  tab: el => setTab(el.dataset.t),
  open: el => openMovie(+el.dataset.id),
  cat: el => { CAT = el.dataset.id; loadHome(); },
  link: el => tg.openLink(el.dataset.u),
  tglink: el => tg.openTelegramLink(el.dataset.u),
  reload: () => { TAB === 'home' && ($('#view').innerHTML = '', loadHome()); },
  phone: () => { try { tg.requestContact(ok => { if (ok) { toast('✅ Rahmat'); setTimeout(() => { $('#view').innerHTML = ''; loadHome(); }, 1800); } else toast('Raqam yuborilmadi'); }); } catch (e) { toast('Botga qaytib /start bosing'); setTimeout(() => tg.close(), 1200); } },
  closesheet: () => closeSheet(),
  play: el => play(+el.dataset.id),
  dl: el => download(+el.dataset.id, el.dataset.t, el.dataset.n),
  fav: async el => { try { const r = await api('/fav/' + el.dataset.id, { method: 'POST' }); MV.fav = r.fav; el.classList.toggle('on', r.fav); hap('medium'); toast(r.fav ? '❤️ Sevimlilarga qo\'shildi' : 'Sevimlilardan olib tashlandi'); } catch (e) {} },
  share: el => { const u = `https://t.me/${MV.bot}?start=m${el.dataset.id}`; tg.openTelegramLink(`https://t.me/share/url?url=${encodeURIComponent(u)}&text=${encodeURIComponent('🎬 ' + MV.movie.title + ' — VITRINO TV')}`); },
  copy: el => navigator.clipboard.writeText(el.dataset.c.replace(/\s/g, '')).then(() => toast('📋 Nusxalandi')),
  buy: el => buy(+el.dataset.id),
  closep: () => closePlayer(),
  pp: () => { const v = $('#vd'); v.paused ? v.play() : v.pause(); },
  seek: el => seek(+el.dataset.s),
  speed: () => { const L = [1, 1.25, 1.5, 2, .75]; PL.speed = L[(L.indexOf(PL.speed) + 1) % L.length]; $('#vd').playbackRate = PL.speed; $('#spd').textContent = PL.speed + 'x'; showCtl(); },
  nextep: () => { const n = PL.next; saveProg(); play(n); },
  fs: () => toggleFs()
};
document.addEventListener('click', e => { const el = e.target.closest('[data-act]'); if (!el || !ACT[el.dataset.act]) return; e.preventDefault(); if (!['pp', 'seek', 'speed'].includes(el.dataset.act)) hap(); ACT[el.dataset.act](el); });

/* ---------- real vaqt ---------- */
let es = null;
async function startLive() {
  try {
    const { t } = await api('/live-token');
    if (es) es.close();
    es = new EventSource('/live?t=' + encodeURIComponent(t));
    es.addEventListener('online', e => { $('#online').textContent = JSON.parse(e.data).n + ' online'; });
    es.addEventListener('new', e => { toast('🆕 Yangi kino: ' + JSON.parse(e.data).title); if (TAB === 'home' && !$('#sheet').classList.contains('open') && !PL) loadHome(); });
    es.addEventListener('paid', e => { const d = JSON.parse(e.data); toast(d.ok ? "✅ To'lov tasdiqlandi: " + d.title : "❌ To'lov tasdiqlanmadi"); hap('medium'); if (MV && MV.movie.id === d.movie) openMovie(d.movie); });
    es.onerror = () => { es.close(); setTimeout(startLive, 5000); };
  } catch (e) { setTimeout(startLive, 8000); }
}
(async () => {
  await loadHome();
  setTimeout(() => $('#splash').classList.add('hide'), 700);
  startLive();
  if (M0) { openMovie(+M0); M0 = null; }
})();
</script></body></html>
