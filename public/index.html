<!doctype html>
<html lang="uz"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>VITRINO TV</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--g:#39ff14;--g2:#9dff00;--bg:#050d08;--c:rgba(255,255,255,.05);--b:rgba(120,255,160,.14);--t:#eafff1;--m:#8fb39b;--gold:#ffd24a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:radial-gradient(900px 500px at 50% -10%,#0f4a22 0,transparent 60%),var(--bg);color:var(--t);font:15px/1.4 -apple-system,system-ui,sans-serif;padding-bottom:90px;overflow-x:hidden}
button{font:inherit;color:inherit;border:0;cursor:pointer}
#splash{position:fixed;inset:0;background:#050d08;display:grid;place-items:center;z-index:99;transition:opacity .6s,visibility .6s}
#splash.hide{opacity:0;visibility:hidden}
#splash img{width:86%;max-width:420px;border-radius:24px;animation:pop 1.1s cubic-bezier(.2,.9,.2,1) both;box-shadow:0 0 80px rgba(57,255,20,.35)}
@keyframes pop{from{transform:scale(.6);opacity:0;filter:blur(12px)}to{transform:none;opacity:1;filter:none}}
@keyframes up{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}
@keyframes shine{to{background-position:-200% 0}}
header{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:10px;padding:12px 16px;backdrop-filter:blur(18px);background:rgba(5,13,8,.7);border-bottom:1px solid var(--b)}
header .logo{font-weight:900;font-size:20px;letter-spacing:.5px;font-style:italic}
header .logo b{color:var(--g);text-shadow:0 0 14px rgba(57,255,20,.7)}
#online{margin-left:auto;font-size:12px;color:var(--m);display:flex;align-items:center;gap:6px}
#online:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--g);box-shadow:0 0 10px var(--g);animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.35;transform:scale(.7)}}
.search{margin:14px 16px 6px;display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:16px;background:var(--c);border:1px solid var(--b);transition:.3s}
.search:focus-within{border-color:var(--g);box-shadow:0 0 0 3px rgba(57,255,20,.12)}
.search input{flex:1;background:none;border:0;outline:0;color:var(--t);font:inherit}
.ban{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:10px 16px;scrollbar-width:none}
.ban::-webkit-scrollbar{display:none}
.b{flex:0 0 88%;aspect-ratio:16/8;border-radius:20px;overflow:hidden;scroll-snap-align:center;box-shadow:0 12px 30px rgba(57,255,20,.15);border:1px solid var(--b);animation:up .6s both}
.b img,.b video{width:100%;height:100%;object-fit:cover;display:block}
.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:9px 16px;border-radius:99px;background:var(--c);border:1px solid var(--b);color:var(--m);transition:.25s}
.chip.on{background:linear-gradient(135deg,var(--g),var(--g2));color:#031a08;font-weight:800;box-shadow:0 6px 20px rgba(57,255,20,.35);transform:translateY(-1px)}
h2{margin:14px 16px 8px;font-size:18px}
.g{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;padding:0 16px}
.card{position:relative;border-radius:18px;overflow:hidden;background:var(--c);border:1px solid var(--b);animation:up .5s both;animation-delay:calc(var(--i)*45ms);transition:transform .2s,box-shadow .3s}
.card:active{transform:scale(.95)}
.card .p{aspect-ratio:2/3;width:100%;object-fit:cover;display:block;background:#0b1a11}
.card .ph{aspect-ratio:2/3;display:grid;place-items:center;font-size:40px;background:#0b1a11}
.card .i{padding:10px 12px}
.card .i b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .i small{color:var(--m)}
.tag{position:absolute;top:10px;left:10px;padding:4px 10px;border-radius:99px;font-size:11px;font-weight:800;background:var(--g);color:#031a08}
.tag.paid{background:var(--gold)}
.tag.ser{left:auto;right:10px;background:rgba(0,0,0,.65);color:#fff}
.sk{border-radius:18px;aspect-ratio:2/3;background:linear-gradient(110deg,#0b1a11 30%,#15301f 50%,#0b1a11 70%);background-size:200% 100%;animation:shine 1.3s infinite}
nav{position:fixed;left:16px;right:16px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:20;display:flex;padding:6px;border-radius:22px;background:rgba(10,24,15,.85);backdrop-filter:blur(20px);border:1px solid var(--b);box-shadow:0 10px 40px rgba(0,0,0,.6)}
nav button{flex:1;padding:12px;border-radius:16px;background:none;color:var(--m);font-weight:700;transition:.3s}
nav button.on{background:linear-gradient(135deg,var(--g),var(--g2));color:#031a08;box-shadow:0 6px 20px rgba(57,255,20,.4)}
.sheet{position:fixed;inset:0;z-index:50;background:var(--bg);transform:translateY(100%);transition:transform .45s cubic-bezier(.2,.9,.2,1);overflow:auto}
.sheet.open{transform:none}
.hero{position:relative;height:56vh;overflow:hidden}
.hero img{width:100%;height:100%;object-fit:cover}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 40%,var(--bg))}
.det{padding:0 18px 40px;margin-top:-60px;position:relative;z-index:2;animation:up .5s both}
.det h1{margin:0 0 6px;font-size:26px}
.mut{color:var(--m)}
.eps{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0}
.ep,.big{padding:14px 20px;border-radius:16px;background:linear-gradient(135deg,var(--g),var(--g2));color:#031a08;font-weight:800;box-shadow:0 8px 24px rgba(57,255,20,.35);transition:.2s}
.ep:active,.big:active{transform:scale(.94)}
.big{width:100%;margin-top:12px}
.note,.pay{padding:16px;border-radius:18px;background:var(--c);border:1px solid var(--b);margin-top:16px}
.pm{padding:12px;margin:10px 0;border-radius:14px;background:rgba(255,255,255,.04)}
.card-no{font-size:19px;font-weight:800;letter-spacing:1px;color:var(--gold);margin:4px 0}
.up{display:block;padding:14px;border:1px dashed var(--g);border-radius:14px;text-align:center;margin-top:10px;color:var(--g)}
.x{position:fixed;top:calc(14px + env(safe-area-inset-top));right:14px;z-index:70;width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;font-size:18px;backdrop-filter:blur(10px)}
#player{position:fixed;inset:0;background:#000;z-index:60;display:none;align-items:center}
#player.open{display:flex}
#player video{width:100%;max-height:100vh}
#player .dl{position:absolute;bottom:calc(24px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);padding:12px 22px;border-radius:99px;background:rgba(0,0,0,.7);color:var(--g);font-weight:800;border:1px solid var(--g)}
.lock{padding:30px 20px;text-align:center;animation:up .5s both}
.lock h2{margin:10px 0}
.lk{display:block;padding:15px;margin:10px 0;border-radius:16px;background:var(--c);border:1px solid var(--b);color:var(--t);text-decoration:none;font-weight:700}
#toast{position:fixed;top:calc(16px + env(safe-area-inset-top));left:50%;transform:translate(-50%,-120px);z-index:100;padding:12px 20px;border-radius:99px;background:var(--g);color:#031a08;font-weight:800;transition:.4s cubic-bezier(.2,.9,.2,1);max-width:90%;text-align:center}
#toast.show{transform:translate(-50%,0)}
</style></head><body>
<div id="splash"><img src="/logo.png" alt="VITRINO TV"></div>
<header><div class="logo">VITRINO<b>TV</b></div><div id="online">jonli</div></header>
<div id="view"></div>
<nav><button id="n1" class="on" onclick="tab(1)">🏠 Bosh sahifa</button><button id="n2" onclick="tab(2)">⭐ Kinolarim</button></nav>
<div id="sheet" class="sheet"></div>
<div id="player"></div>
<div id="toast"></div>
<script>
const tg = window.Telegram.WebApp; tg.ready(); tg.expand();
try { tg.setHeaderColor('#050d08'); tg.setBackgroundColor('#050d08'); } catch (e) {}
const BOT = new URLSearchParams(location.search).get('b') || 1;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = p => p ? Number(p).toLocaleString('ru') + " so'm" : 'BEPUL';
let q = '', cat = '', curTab = 1, bannerTimer;

async function api(p, opt = {}) {
  const r = await fetch('/api' + p, { ...opt, headers: { 'x-init': tg.initData, 'x-bot': BOT, ...(opt.headers || {}) } });
  if (r.status === 403) { document.body.innerHTML = '<div class="lock"><h2>🚫 Siz bloklangansiz</h2></div>'; throw 0; }
  if (!r.ok) throw await r.json().catch(() => ({}));
  return r.json();
}
function toast(t) { const e = $('#toast'); e.textContent = t; e.classList.add('show'); setTimeout(() => e.classList.remove('show'), 2600); }
function cardHtml(m, i) {
  const poster = m.poster ? `<img class="p" loading="lazy" src="/files/${esc(m.poster)}">` : '<div class="ph">🎬</div>';
  return `<div class="card" style="--i:${i % 12}" onclick="openMovie(${m.id})">${poster}
    <span class="tag ${m.price ? 'paid' : ''}">${fmt(m.price)}</span>${m.type === 'series' ? '<span class="tag ser">SERIAL</span>' : ''}
    <div class="i"><b>${esc(m.title)}</b><small>${m.year || ''} ${m.cat ? '• ' + esc(m.cat) : ''}</small></div></div>`;
}
function skeleton() { $('#view').innerHTML = '<div class="g" style="margin-top:20px">' + '<div class="sk"></div>'.repeat(6) + '</div>'; }

async function load() {
  if (curTab === 2) return mine();
  if (!$('#grid')) skeleton();
  let d;
  try { d = await api(`/home?q=${encodeURIComponent(q)}&cat=${cat}`); } catch (e) { return toast('Ulanishda xatolik'); }
  if (d.missing.length) return lock(d.missing);
  if (!$('#grid')) {
    $('#view').innerHTML = `<div class="search">🔍<input id="si" placeholder="Kino qidirish..." value="${esc(q)}"></div>
      <div class="ban" id="ban"></div><div class="chips" id="chips"></div><h2>🔥 Yangi kinolar</h2><div class="g" id="grid"></div>`;
    let tm; $('#si').oninput = e => { clearTimeout(tm); tm = setTimeout(() => { q = e.target.value; load(); }, 350); };
    $('#ban').innerHTML = d.banners.map(b => `<div class="b" ${b.link ? `onclick="tg.openLink('${esc(b.link)}')"` : ''}>${b.kind === 'video' ? `<video src="/files/${esc(b.file)}" autoplay muted loop playsinline></video>` : `<img src="/files/${esc(b.file)}">`}</div>`).join('');
    if (!d.banners.length) $('#ban').remove();
    clearInterval(bannerTimer);
    bannerTimer = setInterval(() => { const b = $('#ban'); if (b) b.scrollTo({ left: (b.scrollLeft + b.clientWidth * .88 + 12) % (b.scrollWidth - 10), behavior: 'smooth' }); }, 4500);
  }
  $('#chips').innerHTML = `<button class="chip ${cat ? '' : 'on'}" onclick="setCat('')">Hammasi</button>` + d.categories.map(c => `<button class="chip ${cat == c.id ? 'on' : ''}" onclick="setCat(${c.id})">${esc(c.name)}</button>`).join('');
  $('#grid').innerHTML = d.movies.map(cardHtml).join('') || '<p class="mut" style="grid-column:1/3;text-align:center">Hech narsa topilmadi</p>';
}
function setCat(c) { cat = c; load(); }
function lock(ch) {
  $('#view').innerHTML = `<div class="lock"><div style="font-size:60px">🔒</div><h2>Davom etish uchun obuna bo'ling</h2><p class="mut">Quyidagi kanal/guruhlarga a'zo bo'ling va "Tekshirish" ni bosing</p>
  ${ch.map(c => `<a class="lk" href="#" onclick="tg.openTelegramLink('${esc(c.link)}');return false">📢 ${esc(c.title)}</a>`).join('')}
  <button class="big" onclick="load()">✅ Tekshirish</button></div>`;
}
async function mine() {
  const d = await api('/my');
  $('#view').innerHTML = `<h2>⭐ Sotib olingan kinolar</h2><div class="g">${d.map(cardHtml).join('') || '<p class="mut" style="grid-column:1/3;text-align:center;margin-top:40px">Hali xarid yo\'q</p>'}</div>`;
}
function tab(n) { curTab = n; $('#n1').classList.toggle('on', n == 1); $('#n2').classList.toggle('on', n == 2); $('#view').innerHTML = ''; load(); }

async function openMovie(id) {
  const S = $('#sheet'); S.innerHTML = '<div class="sk" style="height:60vh;border-radius:0"></div>'; S.classList.add('open'); S.scrollTop = 0;
  tg.BackButton.show();
  let d; try { d = await api('/movie/' + id); } catch (e) { return closeSheet(); }
  const m = d.movie; let act = '';
  if (d.owned) act = d.episodes.length ? `<div class="eps">${d.episodes.map(e => `<button class="ep" onclick="play(${e.id})">▶ ${m.type === 'series' ? e.number + '-qism' : "Ko'rish"}</button>`).join('')}</div>` : '<p class="mut">Video hali yuklanmagan</p>';
  else if (d.pending) act = '<div class="note">⏳ To\'lovingiz tekshirilmoqda. Tasdiqlangach xabar keladi.</div>';
  else act = `<div class="pay"><h3 style="margin:0">💳 To'lov: ${fmt(m.price)}</h3>
    ${d.pay.map(p => `<div class="pm"><b>${esc(p.name)}</b><div class="card-no" data-c="${esc(p.card)}" onclick="cp(this.dataset.c)">${esc(p.card)} 📋</div><small class="mut">${esc(p.holder)} ${esc(p.note)}</small></div>`).join('') || '<p class="mut">To\'lov usullari hali qo\'shilmagan</p>'}
    <label class="up"><span>📎 Chek rasmini tanlang</span><input type="file" id="rc" accept="image/*" hidden onchange="this.previousElementSibling.textContent='✅ '+this.files[0].name"></label>
    <button class="big" onclick="buy(${m.id})">Chekni yuborish</button></div>`;
  S.innerHTML = `<div class="hero">${m.poster ? `<img src="/files/${esc(m.poster)}">` : ''}</div>
    <div class="det"><h1>${esc(m.title)}</h1><div class="mut">${m.year || ''} • ${esc(m.cat || '')} • ${m.type === 'series' ? 'Serial' : 'Kino'} • 👁 ${m.views}</div>
    <p>${esc(m.description)}</p>${act}</div>`;
}
function closeSheet() { $('#sheet').classList.remove('open'); tg.BackButton.hide(); }
function cp(t) { navigator.clipboard.writeText(t.replace(/\s/g, '')).then(() => toast('📋 Nusxalandi')); }
async function buy(id) {
  const f = $('#rc') && $('#rc').files[0]; if (!f) return toast('Avval chek rasmini tanlang');
  const fd = new FormData(); fd.append('receipt', f);
  try { await api('/buy/' + id, { method: 'POST', body: fd }); toast('✅ Yuborildi'); openMovie(id); } catch (e) { toast(e.error || 'Xatolik'); }
}
async function play(id) {
  try {
    const p = await api('/play/' + id), P = $('#player');
    P.innerHTML = `<video src="${p.url}" controls autoplay playsinline></video><button class="x" onclick="closeP()">✕</button>${p.dl ? `<button class="dl" data-u="${p.dl}" onclick="tg.openLink(location.origin+this.dataset.u)">⬇ Yuklab olish</button>` : ''}`;
    P.classList.add('open');
  } catch (e) { toast('Ochib bo\'lmadi'); }
}
function closeP() { const P = $('#player'); const v = P.querySelector('video'); if (v) v.pause(); P.innerHTML = ''; P.classList.remove('open'); }
tg.BackButton.onClick(() => { if ($('#player').classList.contains('open')) closeP(); else closeSheet(); });

try {
  const es = new EventSource('/live');
  es.addEventListener('online', e => { $('#online').textContent = JSON.parse(e.data).n + ' online'; });
  es.addEventListener('new', e => { toast('🆕 Yangi kino: ' + JSON.parse(e.data).title); if (curTab === 1) load(); });
} catch (e) {}
setTimeout(() => $('#splash').classList.add('hide'), 1500);
load();
</script></body></html>
